<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0B0B0D">
<meta name="description" content="Portfólio de Luiz Felipe Araújo dos Santos: vídeos, fotos e artes feitos para a mídia da igreja.">
<title>Luiz Felipe · Vídeos e artes</title>
<style>
  :root{
    --bg:#0B0B0D; --card:#151519; --line:#26262d; --text:#F4F2EC; --soft:#A3A19A; --accent:#F25C3C; --accent2:#FF9A5A;
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;scroll-padding-top:64px;}
  body{margin:0;background:var(--bg);color:var(--text);font:100%/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
  a{color:inherit;}
  .wrap{max-width:1160px;margin:0 auto;padding:0 20px;}

  nav{position:sticky;top:0;z-index:10;background:rgba(11,11,13,.62);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border-bottom:1px solid rgba(255,255,255,.06);}
  nav .wrap{display:flex;justify-content:space-between;align-items:center;height:58px;}
  nav b{font-weight:650;letter-spacing:-.01em;}
  nav a{text-decoration:none;color:var(--soft);margin-left:22px;font-size:14px;transition:color .2s;}
  nav a:hover{color:var(--text);}

  .hero{position:relative;padding:110px 0 80px;overflow:hidden;}
  .hero::before{content:"";position:absolute;inset:-20% -10% auto auto;width:640px;height:640px;background:radial-gradient(closest-side,rgba(242,92,60,.28),rgba(255,154,90,.08) 55%,transparent 75%);filter:blur(10px);pointer-events:none;}
  .hero .wrap{position:relative;}
  .eyebrow{color:var(--accent2);font-size:13px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;}
  h1{font-size:clamp(40px,8vw,84px);line-height:1;margin:16px 0 22px;letter-spacing:-.035em;font-weight:750;max-width:11em;}
  .hero p{max-width:520px;color:var(--soft);font-size:19px;line-height:1.55;margin:0 0 32px;}
  .btn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;padding:13px 24px;border-radius:999px;border:1px solid var(--accent);font-weight:600;font-size:15px;transition:transform .15s var(--ease),background .25s,border-color .25s,color .25s;}
  .btn:active{transform:scale(.97);}
  .btn.ghost{background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--text);margin-left:10px;}

  /* Nenhum botão fica selecionado: o laranja aparece só no botão sob o cursor (ou em foco) */
  @media(hover:hover){
    .links .btn:hover,.cta .btn:hover{background:var(--accent);border-color:var(--accent);color:#fff;}
  }
  .links .btn:focus-visible,.cta .btn:focus-visible{background:var(--accent);border-color:var(--accent);color:#fff;outline:2px solid var(--text);outline-offset:3px;}
  .cta .btn.ghost:first-child{margin-left:0;margin-top:0;}

  section{padding:64px 0;}
  h2{font-size:clamp(28px,4.5vw,40px);margin:0 0 10px;letter-spacing:-.025em;line-height:1.1;}
  .lead{color:var(--soft);margin:0 0 30px;max-width:540px;font-size:17px;}

  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:26px;padding:5px;border:1px solid var(--line);border-radius:999px;width:fit-content;background:rgba(255,255,255,.02);}
  .chip{border:0;background:transparent;color:var(--soft);padding:8px 18px;border-radius:999px;cursor:pointer;font:inherit;font-size:14px;transition:background .2s,color .2s;}
  .chip:hover{color:var(--text);}
  .chip.on{background:var(--text);color:var(--bg);font-weight:600;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,480px),1fr));gap:22px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:transform .35s var(--ease),border-color .3s,box-shadow .35s;}
  .card:hover{transform:translateY(-4px);border-color:#3a3a44;box-shadow:0 18px 40px -18px rgba(0,0,0,.8);}
  .frame{position:relative;aspect-ratio:16/9;background:#000;display:flex;align-items:center;justify-content:center;color:var(--soft);font-size:14px;text-align:center;padding:12px;}
  .frame iframe,.frame video{position:absolute;inset:0;width:100%;height:100%;border:0;}
  .frame.vertical{aspect-ratio:9/16;}
  .frame.ig{aspect-ratio:auto;display:block;padding:0;background:#fff;min-height:460px;}
  .frame.img{aspect-ratio:auto;padding:0;}
  .frame.img img{display:block;width:100%;height:auto;cursor:zoom-in;}
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;cursor:zoom-out;}
  .lightbox.on{display:flex;}
  .lightbox img{max-width:100%;max-height:100%;border-radius:10px;}
  .info{padding:16px 18px 20px;}
  .info h3{margin:2px 0 4px;font-size:17px;letter-spacing:-.01em;}
  .info small{color:var(--accent2);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:11.5px;}
  .info p{margin:6px 0 0;color:var(--soft);font-size:14.5px;}
  .info a{color:var(--accent2);text-decoration:none;font-size:14px;}
  .info a:hover{text-decoration:underline;}
  .placeholder .info h3{color:var(--soft);}

  .about{display:grid;grid-template-columns:1.4fr 1fr;gap:44px;align-items:start;}
  .about-text p{margin:0 0 18px;color:var(--soft);font-size:18px;line-height:1.65;}
  .about-text p:first-child{color:var(--text);font-size:20px;}
  .facts{list-style:none;margin:0;padding:0;display:grid;gap:12px;}
  .facts li{border:1px solid var(--line);border-radius:16px;padding:18px 20px;background:var(--card);}
  .facts b{display:block;font-size:16px;margin-bottom:2px;}
  .facts span{color:var(--soft);font-size:14.5px;}

  .contact{border:1px solid var(--line);border-radius:24px;padding:clamp(28px,5vw,48px);background:radial-gradient(120% 140% at 0% 0%,rgba(242,92,60,.14),transparent 60%),var(--card);}
  .links{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px;}
  .links .btn.ghost{margin-left:0;}
  footer{padding:36px 0 54px;color:var(--soft);font-size:13.5px;text-align:center;}

  .js .reveal{opacity:0;transform:translateY(18px);transition:opacity .7s var(--ease),transform .7s var(--ease);}
  .js .reveal.in{opacity:1;transform:none;}
  @keyframes rise{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
  .hero .eyebrow,.hero h1,.hero p,.hero .cta{animation:rise .8s var(--ease) both;}
  .hero h1{animation-delay:.08s;} .hero p{animation-delay:.16s;} .hero .cta{animation-delay:.24s;}

  @media(max-width:760px){.about{grid-template-columns:1fr;gap:28px;}.hero{padding:80px 0 56px;}}
  @media(max-width:560px){nav a{margin-left:14px;}.btn.ghost{margin:10px 0 0;}.links .btn.ghost{margin:0;}}
  @media(prefers-reduced-motion:reduce){
    html{scroll-behavior:auto;}
    .hero .eyebrow,.hero h1,.hero p,.hero .cta{animation:none;}
    .js .reveal{opacity:1;transform:none;transition:none;}
    .card,.btn{transition:none;}
    .card:hover{transform:none;}
  }
</style>
<script>document.documentElement.classList.add("js");</script>
</head>
<body>

<nav><div class="wrap"><b id="navName"></b><div><a href="#trabalhos">Trabalhos</a><a href="#sobre">Sobre</a><a href="#contato">Contato</a></div></div></nav>

<header class="hero"><div class="wrap">
  <span class="eyebrow">Vídeos · Fotos · Artes</span>
  <h1 id="heroName"></h1>
  <p id="heroText"></p>
  <div class="cta"><a class="btn ghost" href="#trabalhos">Ver trabalhos</a><a class="btn ghost" href="#contato">Falar comigo</a></div>
</div></header>

<section id="trabalhos" class="reveal"><div class="wrap">
  <h2>Trabalhos</h2>
  <p class="lead">Vídeos e artes direto do meu Instagram.</p>
  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>
</div></section>

<section id="sobre" class="reveal"><div class="wrap">
  <h2>Sobre mim</h2>
  <div class="about" style="margin-top:28px">
    <div class="about-text" id="aboutText"></div>
    <ul class="facts" id="aboutFacts"></ul>
  </div>
</div></section>

<section id="contato" class="reveal"><div class="wrap"><div class="contact">
  <h2>Quer fazer um trabalho comigo?</h2>
  <p class="lead" style="margin-bottom:0">Me chama no WhatsApp ou no Instagram e conta o que você precisa.</p>
  <div class="links" id="links"></div>
</div></div></section>

<footer><div class="wrap">© <span id="year"></span> <span id="footName"></span></div></footer>

<script>
  /* ============ EDITE AQUI ============ */
  const NAME = "Luiz Felipe Araújo dos Santos";
  const SHORT_NAME = "Luiz Felipe";
  const TAGLINE = "Gravo, edito e faço as artes da mídia da minha igreja. Aqui estão alguns dos meus trabalhos.";

  // Cada item: título, categoria, tipo e código/caminho.
  //  type: "instagram" (código do post: instagram.com/p/CODIGO/), "youtube" (ID do vídeo),
  //        "drive" (ID do arquivo no Google Drive), "file" (caminho do mp4 no repositório)
  //        ou "image" (caminho da imagem no repositório, ex.: "artes/cartaz.jpg")
  const VIDEOS = [
    // Vídeos
    { title:"Vídeo 1", category:"Vídeos", type:"instagram", id:"DeHDUEqBt8s" },
    { title:"Vídeo 2", category:"Vídeos", type:"instagram", id:"DbEPlA3Jxnh" },
    { title:"Vídeo 3", category:"Vídeos", type:"instagram", id:"DeFqYOCp_7f" },
    { title:"Vídeo 4", category:"Vídeos", type:"instagram", id:"DaZCz4MJTbI" },
    { title:"Vídeo 5", category:"Vídeos", type:"instagram", id:"DgAZCJ0C6AQ" },
    // Artes
    { title:"11º Aniversário do Eletrônico Brilho Celeste", category:"Artes", type:"image", id:"artes/brilho-celeste-11-aniversario.jpg" },
    { title:"17º Congresso UNIJOVEM", category:"Artes", type:"image", id:"artes/congresso-unijovem-17.png" },
    { title:"Arte 1", category:"Artes", type:"instagram", id:"DasUzZCpUjl" },
    { title:"Arte 2", category:"Artes", type:"instagram", id:"Dau490iJcSK" },
    { title:"Arte 3", category:"Artes", type:"instagram", id:"Daxcp4kpG8v" },
    { title:"Arte 4", category:"Artes", type:"instagram", id:"Daz8Lsspolr" },
    // Modelo: { title:"Título", category:"Vídeos", type:"instagram", id:"CODIGO", desc:"O que você fez." },
  ];

  // Sobre mim: cada item de "text" vira um parágrafo.
  const ABOUT = {
    text: [
      "Cuido da mídia da minha igreja: tiro as fotos, gravo os vídeos, edito e faço as artes de divulgação.",
      "É esse trabalho que você vê aqui. Se precisa de alguém para gravar, editar ou criar uma arte, é só me chamar."
    ],
    facts: [
      {t:"Vídeos", d:"Gravação e edição"},
      {t:"Fotos", d:"Eventos e cultos"},
      {t:"Artes", d:"Divulgação e design gráfico"}
    ]
  };

  const CONTACTS = [
    {label:"WhatsApp", url:"https://wa.me/5581986280322"},
    {label:"Instagram", url:"https://www.instagram.com/luizfelipe5164/"},
    {label:"E-mail", url:"mailto:l01z.55.66.77.44@gmail.com"}
  ];
  /* ================================== */

  const $ = id => document.getElementById(id);
  $("navName").textContent = SHORT_NAME; $("heroName").textContent = NAME; $("footName").textContent = NAME;
  $("heroText").textContent = TAGLINE; $("year").textContent = new Date().getFullYear();

  $("aboutText").innerHTML = ABOUT.text.map(p=>`<p>${p}</p>`).join("");
  $("aboutFacts").innerHTML = ABOUT.facts.map(f=>`<li><b>${f.t}</b><span>${f.d}</span></li>`).join("");
  $("links").innerHTML = CONTACTS.length
    ? CONTACTS.map(c=>`<a class="btn ghost" href="${c.url}" target="_blank" rel="noopener">${c.label}</a>`).join("")
    : "";

  function embed(v){
    if(v.type==="image") return `<img src="${v.id}" alt="${v.title}" loading="lazy" data-zoom="${v.id}">`;
    if(v.type==="instagram") return `<blockquote class="instagram-media" data-instgrm-captioned data-instgrm-permalink="https://www.instagram.com/p/${v.id}/" data-instgrm-version="14" style="background:#FFF;border:0;margin:0;width:100%;min-width:0;max-width:none;"></blockquote>`;
    if(v.type==="youtube") return `<iframe src="https://www.youtube.com/embed/${v.id}" allowfullscreen loading="lazy" title="${v.title}"></iframe>`;
    if(v.type==="drive") return `<iframe src="https://drive.google.com/file/d/${v.id}/preview" allowfullscreen loading="lazy" title="${v.title}"></iframe>`;
    return `<video src="${v.id}" controls preload="metadata"></video>`;
  }
  function render(cat){
    const list = VIDEOS.filter(v=>cat==="Todos"||v.category===cat);
    if(!VIDEOS.length){
      $("grid").innerHTML = [1,2,3].map(()=>`<div class="card placeholder"><div class="frame">Seu vídeo aparece aqui</div><div class="info"><small>Categoria</small><h3>Adicione um item em VIDEOS</h3><p>Siga o exemplo comentado no começo do script.</p></div></div>`).join("");
      return;
    }
    $("grid").innerHTML = list.map(v=>`<div class="card"><div class="frame ${v.type==='image'?'img':(v.type==='instagram'?'ig':(v.vertical?'vertical':''))}">${embed(v)}</div><div class="info"><small>${v.category||""}</small><h3>${v.title}</h3>${v.desc?`<p>${v.desc}</p>`:""}${v.type==="instagram"?`<p><a href="https://www.instagram.com/p/${v.id}/" target="_blank" rel="noopener">Ver no Instagram</a></p>`:""}</div></div>`).join("");
    processIG();
  }
  function processIG(){
    if(!document.querySelector(".instagram-media")) return;
    if(window.instgrm){ window.instgrm.Embeds.process(); return; }
    if(document.getElementById("igjs")) return;
    const s=document.createElement("script"); s.id="igjs"; s.async=true; s.src="https://www.instagram.com/embed.js";
    s.onload=()=>window.instgrm&&window.instgrm.Embeds.process();
    document.body.appendChild(s);
  }
  const cats = ["Todos", ...new Set(VIDEOS.map(v=>v.category).filter(Boolean))];
  $("filters").innerHTML = VIDEOS.length>1 ? cats.map((c,i)=>`<button class="chip ${i?'':'on'}" data-c="${c}">${c}</button>`).join("") : "";
  $("filters").addEventListener("click",e=>{
    const b=e.target.closest(".chip"); if(!b) return;
    document.querySelectorAll(".chip").forEach(x=>x.classList.remove("on")); b.classList.add("on"); render(b.dataset.c);
  });
  render("Todos");

  // Aparecer suavemente ao rolar a página
  const reveals = document.querySelectorAll(".reveal");
  if("IntersectionObserver" in window){
    const io = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } }),{threshold:.08});
    reveals.forEach(el=>io.observe(el));
  } else reveals.forEach(el=>el.classList.add("in"));

  const lb = document.createElement("div"); lb.className = "lightbox"; lb.innerHTML = "<img alt=''>";
  document.body.appendChild(lb);
  document.addEventListener("click", e=>{
    const img = e.target.closest("img[data-zoom]");
    if(img){ lb.firstChild.src = img.dataset.zoom; lb.classList.add("on"); return; }
    if(lb.classList.contains("on")) lb.classList.remove("on");
  });
  document.addEventListener("keydown", e=>{ if(e.key==="Escape") lb.classList.remove("on"); });
</script>
</body>
</html>
